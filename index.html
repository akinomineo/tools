<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同人おしながきジェネレーター</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Dela+Gothic+One&family=DotGothic16&family=Kaisei+Decol:wght@400;700&family=Klee+One:wght@400;600&family=Kosugi&family=Kosugi+Maru&family=M+PLUS+1p:wght@400;700;800&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;700;900&family=RocknRoll+One&family=Sawarabi+Gothic&family=Sawarabi+Mincho&family=Shippori+Mincho:wght@400;700;800&family=Yusei+Magic&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(120deg, #f43f5e, #9333ea);
      color: #fff;
      font-size: 19px;
    }

    .brand h1 { margin: 0; font-size: 14px; line-height: 1.3; }

    .brand p {
      overflow: hidden;
      margin: 2px 0 0;
      color: #94a3b8;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions { display: flex; flex: 0 0 auto; gap: 6px; }

    .button {
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .button-print { background: #475569; }
    .button-png { background: #059669; }

    #mainLayout {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    #settingsPanel {
      display: flex;
      flex: 0 0 390px;
      flex-direction: column;
      max-height: 100%;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #1e293b;
    }

    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }

    .panel-heading small { color: #4ade80; font-size: 9px; }
    #settingsContent { flex: 1 1 auto; overflow: auto; padding: 14px; }

    .section {
      margin-bottom: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: rgba(15, 23, 42, .65);
    }

    .section h2 { margin: 0 0 10px; color: #fb7185; font-size: 12px; }
    .field { display: block; margin-bottom: 9px; color: #94a3b8; font-size: 10px; }
    .field:last-child { margin-bottom: 0; }

    .control {
      display: block;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
    }

    .control:disabled { opacity: .5; }

    .color-control {
      width: 48px;
      height: 31px;
      margin-top: 4px;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px;
      background: #1e293b;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 7px;
    }

    .palette button {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 10px;
      text-align: left;
    }

    .palette button.selected { outline: 2px solid #f43f5e; }

    .swatch {
      display: flex;
      width: 54px;
      height: 16px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
    }

    .swatch span { flex: 1 1 0; }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      color: #94a3b8;
      font-size: 10px;
    }

    .check-row input[type="checkbox"] { accent-color: #f43f5e; }

    .upload-box {
      display: block;
      border: 2px dashed #9f1239;
      border-radius: 9px;
      padding: 13px;
      background: rgba(30, 41, 59, .5);
      color: #e2e8f0;
      text-align: center;
      cursor: pointer;
    }

    .upload-box span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .upload-box small {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
      font-size: 9px;
    }

    .item-card {
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px;
      background: #0f172a;
    }

    .item-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
    }

    .item-card-head button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 10px;
    }

    .item-card-head button:disabled { opacity: .4; }
    .delete-item { margin-left: 4px; color: #fb7185 !important; }

    .add-item {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 7px;
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
    }

    #workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px 20px 20px;
      background: #020617;
    }

    #canvasContainer {
      position: relative;
      flex: none;
      overflow: hidden;
      border: 1px solid #475569;
      background: #fff;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
      line-height: 0;
    }

    #canvasStage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    #previewCanvas { display: block; }

    .guide {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      border: 1px dashed rgba(15,23,42,.85);
    }

    #trimGuide { outline: 1px solid rgba(255,255,255,.85); }
    #safeGuide { border-color: rgba(225,29,72,.95); }
    .hidden { display: none !important; }

    #zoomInfo {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(30,41,59,.95);
      color: #cbd5e1;
      font-size: 10px;
    }

    #previewToolbar {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px;
      background: rgba(30,41,59,.96);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      font-size: 10px;
    }

    #previewToolbar button {
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
    }

    #previewToolbarDrag { cursor: grab; touch-action: none; }

    @media (max-width: 767px) {
      #mainLayout { display: block; overflow: auto; }

      #settingsPanel {
        width: 100%;
        max-height: none;
        overflow: visible;
        border: 0;
      }

      #settingsContent { overflow: visible; }

      #workspace {
        width: 100%;
        height: 75vh;
        min-height: 480px;
      }

      #previewToolbar {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✦</div>
      <div>
        <h1>同人おしながきジェネレーター</h1>

    <div class="actions">

        <section class="section">

          <div class="two-col">
            <label class="field">サークル名サイズ

            <label class="field">サークル文字色

  <script>
    "use strict";

    function getRelativeLuminance(hex) {
      const channels = hex.replace("#", "").match(/.{2}/g)
        .map((channel) => parseInt(channel, 16) / 255);
      const linear = channels.map((value) =>
        value <= 0.04045
          ? value / 12.92
          : ((value + 0.055) / 1.055) ** 2.4
      );
      return 0.2126 * linear[0] +
        0.7152 * linear[1] +
        0.0722 * linear[2];
    }

    function getLightestColor(colors) {
      return colors.reduce((lightest, color) =>
        getRelativeLuminance(color) > getRelativeLuminance(lightest)
          ? color
          : lightest
      );
    }

    function getDarkestColor(colors) {
      return colors.reduce((darkest, color) =>
        getRelativeLuminance(color) < getRelativeLuminance(darkest)
          ? color
          : darkest
      );
    }

    function getSecondLightestColor(colors) {
      return [...colors].sort(
        (a, b) => getRelativeLuminance(b) - getRelativeLuminance(a)
      )[1];
    }

    function getSaturation(hex) {
      const value = hex.replace("#", "");
      const red = parseInt(value.slice(0, 2), 16) / 255;
      const green = parseInt(value.slice(2, 4), 16) / 255;
      const blue = parseInt(value.slice(4, 6), 16) / 255;
      const maximum = Math.max(red, green, blue);
      const minimum = Math.min(red, green, blue);

      return maximum === 0 ? 0 : (maximum - minimum) / maximum;
    }

    function getMostVividColor(colors) {
      return colors.reduce((mostVivid, color) =>
        getSaturation(color) > getSaturation(mostVivid)
          ? color
          : mostVivid
      );
    }

    const PALETTES = [
      {
        name:"パターン1",
        colors:["#9C1F11", "#B64466", "#CAB49B", "#AE7A70", "#FFA4B9", "#6E4B1F"]
      },
      {
        name:"パターン2",
        colors:["#9C5B11", "#9C1611", "#989C11", "#FFD8AC", "#5C0E0A", "#BBC05B"]
      },
      {
        name:"パターン3",
        colors:["#119C5B", "#CBF1C7", "#004C4F", "#00793F", "#93DC8E", "#48BABE"]
      },
      {
        name:"パターン4",
        colors:["#11349C", "#81A5B5", "#D4D9FF", "#4D6497", "#00364E", "#5C55CD"]
      }
    ].map((palette) => {
      const background = getLightestColor(palette.colors);
      const header = getDarkestColor(palette.colors);
      const ageBandColor = getSecondLightestColor(palette.colors);
      const mostVivid = getMostVividColor(palette.colors);

      const nonBackgroundColors = palette.colors.filter(
        (color) => color.toUpperCase() !== background.toUpperCase()
      );

      const otherCategoryColors = nonBackgroundColors.filter(
        (color) => color.toUpperCase() !== ageBandColor.toUpperCase()
      );

      const categoryColors = [
        header,
        ...otherCategoryColors.filter(
          (color) => color.toUpperCase() !== header.toUpperCase()
        )
      ];

      return {
        ...palette,
        background,
        header,
        ageBandColor,
        mostVivid,
        categoryColors
      };
    });

    const FONT_OPTIONS = [
      { label:"Noto Sans JP（ゴシック）", value:'"Noto Sans JP", sans-serif' },
      { label:"BIZ UDPゴシック", value:'"BIZ UDPGothic", sans-serif' },
      { label:"Zen Kaku Gothic New", value:'"Zen Kaku Gothic New", sans-serif' },
      { label:"M PLUS 1p", value:'"M PLUS 1p", sans-serif' },
      { label:"M PLUS Rounded 1c（丸ゴシック）", value:'"M PLUS Rounded 1c", sans-serif' },
      { label:"Zen Maru Gothic（丸ゴシック）", value:'"Zen Maru Gothic", sans-serif' },
      { label:"Kosugi", value:'"Kosugi", sans-serif' },
      { label:"Kosugi Maru", value:'"Kosugi Maru", sans-serif' },
      { label:"Sawarabi Gothic", value:'"Sawarabi Gothic", sans-serif' },
      { label:"Dela Gothic One（太字）", value:'"Dela Gothic One", sans-serif' },
      { label:"DotGothic16（ドット）", value:'"DotGothic16", sans-serif' },
      { label:"RocknRoll One", value:'"RocknRoll One", sans-serif' },
      { label:"Yusei Magic", value:'"Yusei Magic", sans-serif' },
      { label:"BIZ UDP明朝", value:'"BIZ UDPMincho", serif' },
      { label:"Shippori Mincho", value:'"Shippori Mincho", serif' },
      { label:"Zen Old Mincho", value:'"Zen Old Mincho", serif' },
      { label:"Sawarabi Mincho", value:'"Sawarabi Mincho", serif' },
      { label:"Kaisei Decol", value:'"Kaisei Decol", serif' },
      { label:"Klee One（手書き風）", value:'"Klee One", cursive' },
      { label:"游ゴシック（端末標準）", value:'"Yu Gothic", sans-serif' },
      { label:"メイリオ（端末標準）", value:"Meiryo, sans-serif" },

    const HEADER_FONT_SIZES = {

      WEB_LANDSCAPE: { event:30, space:50, circle:50 },
      PICSQUARE: { event:20, space:30, circle:30 },
      PICREA: { event:30, space:50, circle:50 }

    const DEFAULT_FONT_FAMILY = '"Noto Sans JP", sans-serif';
    const BLEED_MM = 3;

    let paper = "A3";

    let outputWidth = 0;
    let outputHeight = 0;
    let trimWidth = 0;
    let trimHeight = 0;
    let bleedLeft = 0;
    let bleedTop = 0;
    let safeX = 0;

    function getHeaderFontFamily() {
      return getEl("headerFontFamily").value || DEFAULT_FONT_FAMILY;

    function makeDefaultItem(number) {

        image:null,

    function getEl(id) {
      const element = document.getElementById(id);
      if (!element) {
        throw new Error(`必要なHTML要素がありません: #${id}`);
      }
      return element;
    }

    function getReadableTextColor(hex) {
      return getRelativeLuminance(hex) > 0.179 ? "#1e293b" : "#ffffff";
    }

    function getCategoryStyle(category) {
      const colors = selectedPalette.categoryColors;
      const colorByCategory = {
        "新刊":selectedPalette.header,
        "既刊":colors[1],
        "無料配布":colors[2],
        "Web展示":colors[3]
      };
      const color = colorByCategory[category] || selectedPalette.header;

      return {
        background:color,
        text:"#FFFFFF"

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[character]);
    }

    function buildFontOptions(select, selectedValue) {
      select.innerHTML = FONT_OPTIONS.map(({ label, value }) =>

      ).join("");
      select.value = selectedValue;

    function initializeFontControls() {
      buildFontOptions(getEl("headerFontFamily"), DEFAULT_FONT_FAMILY);
      buildFontOptions(getEl("cardFontFamily"), DEFAULT_FONT_FAMILY);

    function getLayoutLabel() {
      const socialPreset = SOCIAL_PRESETS[paper];

      if (socialPreset) {
        return `${socialPreset.label} (${outputWidth} × ${outputHeight}px)`;
      }

      return `${paper}${orientation === "LANDSCAPE" ? "横" : "縦"} 塗り足し込み ${outputWidth} × ${outputHeight}px`;
    }

    function applyPalette(palette) {
      selectedPalette = palette;

      getEl("bgTypeSelect").value = "palette";
      getEl("customBgControls").classList.add("hidden");
      getEl("singleColorControls").classList.add("hidden");
      getEl("bgColorPicker").value = palette.background;

      getEl("headerBgColor").value = palette.header;
      getEl("headerAccentColor").value = palette.categoryColors[1];

      const textColor = getReadableTextColor(palette.header);
      getEl("eventInfoTextColor").value = textColor;
      getEl("spaceInfoTextColor").value = textColor;
      getEl("circleInfoTextColor").value = textColor;

      getEl("eventInfoBgColor").value = palette.header;
      getEl("spaceInfoBgColor").value = palette.header;
      getEl("circleInfoBgColor").value = palette.header;

      renderCanvas();
    }

    function buildPalette() {
      const root = getEl("presetColorPalette");
      root.innerHTML = "";

      PALETTES.forEach((preset) => {
        const button = document.createElement("button");
        button.type = "button";
        button.title = `${preset.name}（6色）`;

        const swatch = document.createElement("span");
        swatch.className = "swatch";

        preset.colors.forEach((color) => {
          const segment = document.createElement("span");
          segment.style.backgroundColor = color;
          swatch.appendChild(segment);
        });

        const label = document.createElement("span");
        label.textContent = preset.name;
        button.append(swatch, label);
        button.classList.toggle("selected", preset.name === selectedPalette.name);

        button.addEventListener("click", () => {
          root.querySelectorAll("button").forEach((element) => {
            element.classList.remove("selected");
          });
          button.classList.add("selected");
          applyPalette(preset);
          getEl("paperSpecLabel").textContent =
            `${getLayoutLabel()}・${selectedPalette.name}`;
        });

        root.appendChild(button);
      });

      applyPalette(selectedPalette);
    }

    function initialize() {
      try {
        initializeFontControls();
        buildPalette();
        renderItems();
        bindEvents();
        updateLayout();

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(renderCanvas).catch(() => {});
        }
      } catch (error) {
        console.error("初期化エラー:", error);
        const label = document.getElementById("paperSpecLabel");
        if (label) label.textContent = `初期化エラー: ${error.message}`;
      }
    }

    function updateLayout() {
      paper = getEl("paperSizeSelect").value;
      const orientationSelect = getEl("orientationSelect");
      const socialPreset = SOCIAL_PRESETS[paper];

      bleedLeft = 0;
      bleedTop = 0;
      safeX = 0;
      safeY = 0;

      if (socialPreset) {
        orientation = socialPreset.orientation;
        orientationSelect.value = orientation;
        orientationSelect.disabled = true;
        outputWidth = trimWidth = socialPreset.width;
        outputHeight = trimHeight = socialPreset.height;
      } else {
        orientationSelect.disabled = false;
        orientation = orientationSelect.value;

        const spec = PRINT_SPECS[paper];
        const landscape = orientation === "LANDSCAPE";
        outputWidth = landscape ? spec.heightPx : spec.widthPx;
        outputHeight = landscape ? spec.widthPx : spec.heightPx;

        const outputWidthMm = landscape ? spec.heightMm : spec.widthMm;
        const outputHeightMm = landscape ? spec.widthMm : spec.heightMm;
        const trimWidthMm = landscape ? spec.trimHeightMm : spec.trimWidthMm;
        const trimHeightMm = landscape ? spec.trimWidthMm : spec.trimHeightMm;

        trimWidth = Math.round(trimWidthMm * outputWidth / outputWidthMm);
        trimHeight = Math.round(trimHeightMm * outputHeight / outputHeightMm);
        bleedLeft = Math.floor((outputWidth - trimWidth) / 2);
        bleedTop = Math.floor((outputHeight - trimHeight) / 2);
        safeX = Math.ceil(BLEED_MM * trimWidth / trimWidthMm);
        safeY = Math.ceil(BLEED_MM * trimHeight / trimHeightMm);
      }

      canvas.width = outputWidth;
      canvas.height = outputHeight;
      getEl("canvasStage").style.width = `${outputWidth}px`;
      getEl("canvasStage").style.height = `${outputHeight}px`;

      const sizes = HEADER_FONT_SIZES[paper];
      getEl("eventInfoFontSize").value = sizes.event;
      getEl("spaceInfoFontSize").value = sizes.space;
      getEl("circleInfoFontSize").value = sizes.circle;

      updateGuides();

      const label = getLayoutLabel();
      getEl("paperSpecLabel").textContent = `${label}・${selectedPalette.name}`;
      getEl("dimensionDisplay").textContent = label;
      getEl("layoutHelp").textContent =
        "ヘッダー文字は指定サイズを上限に、領域に合わせて自動調整します。";

      previewMode = "fit";
      fitPreview();
      renderCanvas();
    }

    function updateGuides() {
      const trimGuide = getEl("trimGuide");
      const safeGuide = getEl("safeGuide");
      const isPrint = Boolean(PRINT_SPECS[paper]);

      trimGuide.classList.toggle("hidden", !isPrint);
      safeGuide.classList.toggle("hidden", !isPrint);
      if (!isPrint) return;

      trimGuide.style.left = `${bleedLeft}px`;
      trimGuide.style.top = `${bleedTop}px`;
      trimGuide.style.width = `${trimWidth}px`;
      trimGuide.style.height = `${trimHeight}px`;

      safeGuide.style.left = `${bleedLeft + safeX}px`;
      safeGuide.style.top = `${bleedTop + safeY}px`;
      safeGuide.style.width = `${Math.max(1, trimWidth - safeX * 2)}px`;
      safeGuide.style.height = `${Math.max(1, trimHeight - safeY * 2)}px`;
    }

    function renderItems() {
      const root = getEl("itemsContainer");
      root.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-card-head">
            <span>頒布物 #${index + 1}</span>
            <div>
              <button type="button" data-move="${index}" data-dir="-1" ${index === 0 ? "disabled" : ""}>↑</button>
              <button type="button" data-move="${index}" data-dir="1" ${index === items.length - 1 ? "disabled" : ""}>↓</button>
              ${items.length > 1 ? `<button type="button" class="delete-item" data-remove="${index}">削除</button>` : ""}
            </div>
          </div>

          <div class="two-col">
            <label class="field">カテゴリ
              <select id="item-${index}-category" name="item-${index}-category" class="control" data-index="${index}" data-key="category">

                  `<option value="${value}" ${item.category === value ? "selected" : ""}>${value}</option>`
                ).join("")}

            <label class="field">年齢区分
              <select id="item-${index}-ageRating" name="item-${index}-ageRating" class="control" data-index="${index}" data-key="ageRating">

            <input id="item-${index}-title" name="item-${index}-title" class="control" type="text" data-index="${index}" data-key="title" value="${escapeHTML(item.title)}">
          </label>

          <label class="field">価格（無料配布・Web展示は空欄）
            <input id="item-${index}-price" name="item-${index}-price" class="control" type="text" data-index="${index}" data-key="price"
              value="${escapeHTML(item.price)}" ${["無料配布","Web展示"].includes(item.category) ? "disabled" : ""}>

      root.querySelectorAll("[data-index]").forEach((input) => {

          items[index][key] = input.value;

          if (key === "category") {
            const price = root.querySelector(
              `[data-index="${index}"][data-key="price"]`

            const noPrice = ["無料配布","Web展示"].includes(input.value);

            if (price) {

              if (noPrice) {

      root.querySelectorAll("[data-noimage]").forEach((input) => {
        input.addEventListener("change", () => {
          const index = Number(input.dataset.noimage);
          if (!items[index]) return;

          items[index].noImage = input.checked;
          const fileInput = root.querySelector(`[data-image="${index}"]`);

          if (fileInput) {
            fileInput.disabled = input.checked;
            if (input.checked) fileInput.value = "";

          renderCanvas();

      root.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const from = Number(button.dataset.move);
          const to = from + Number(button.dataset.dir);
          if (to < 0 || to >= items.length) return;

          [items[from], items[to]] = [items[to], items[from]];
          renderItems();
          renderCanvas();
        });
      });

      root.querySelectorAll("[data-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          items.splice(Number(button.dataset.remove), 1);
          renderItems();
          renderCanvas();

    function addItem() {
      items.push(makeDefaultItem(nextItemNumber++));
      renderItems();
      renderCanvas();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
        image.src = src;
      });
    }

    async function readImageFile(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        throw new Error("画像ファイルを選択してください。");
      }

      const src = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () =>
          reject(new Error(`画像を読み込めませんでした: ${file.name}`));
        reader.readAsDataURL(file);
      });

      const image = await loadImage(src);
      return {
        src,
        image,
        width:image.naturalWidth,
        height:image.naturalHeight
      };
    }

    async function loadItemImage(index, file) {
      if (!file || !items[index]) return;

      try {
        const loaded = await readImageFile(file);
        Object.assign(items[index], {
          image:loaded.image,
          imageSrc:loaded.src,
          imageWidth:loaded.width,
          imageHeight:loaded.height,
          noImage:false
        });
        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    async function uploadBatch(files) {
      if (!files.length) return;

      try {
        const loaded = await Promise.all(Array.from(files).map(readImageFile));

        loaded.forEach((entry) => {
          let target = items.find((item) => !item.image);

          if (!target) {
            target = makeDefaultItem(nextItemNumber++);
            items.push(target);
          }

          Object.assign(target, {
            image:entry.image,
            imageSrc:entry.src,
            imageWidth:entry.width,
            imageHeight:entry.height,
            noImage:false
          });
        });

        renderItems();
        renderCanvas();
      } catch (error) {
        alert(error.message);
      }
    }

    function drawBackground(context) {
      const type = getEl("bgTypeSelect").value;

      if (type === "color") {
        context.fillStyle = getEl("bgColorPicker").value;
        context.fillRect(0, 0, outputWidth, outputHeight);
        return;
      }

      if (type === "custom" && customBackground) {
        context.drawImage(customBackground, 0, 0, outputWidth, outputHeight);
        return;
      }

      context.fillStyle = selectedPalette.background;
      context.fillRect(0, 0, outputWidth, outputHeight);
    }

    function getHeaderStyle(prefix, defaultSize, defaultColor) {
      const sizeElement = document.getElementById(`${prefix}FontSize`);
      const colorElement = document.getElementById(`${prefix}TextColor`);
      const enabledElement = document.getElementById(`${prefix}BgEnabled`);
      const backgroundElement = document.getElementById(`${prefix}BgColor`);
      const parsedSize = Number.parseInt(sizeElement ? sizeElement.value : "", 10);

      return {
        size:Number.isFinite(parsedSize) ? parsedSize : defaultSize,
        family:getHeaderFontFamily(),
        color:(colorElement && colorElement.value) || defaultColor,
        background:enabledElement && enabledElement.checked && backgroundElement
          ? backgroundElement.value
          : ""
      };
    }

    function wrapLines(context, text, maxWidth) {
      const lines = [];

      String(text || "").split("\n").forEach((paragraph) => {
        let line = "";

        for (const character of Array.from(paragraph)) {
          const candidate = line + character;

          if (line && context.measureText(candidate).width > maxWidth) {
            lines.push(line);
            line = character;
          } else {
            line = candidate;
          }
        }

        lines.push(line);
      });

      return lines.length ? lines : [""];
    }

    function fitText(context, text, box, options = {}) {
      const family = options.family || "sans-serif";
      const weight = options.weight || "400";
      const maxFont = Math.max(1, Number(options.maxFont) || 20);
      const minFont = Math.max(1, Number(options.minFont) || 1);
      const lineRatio = options.lineHeight || 1;
      const width = Math.max(1, box.width);
      const height = Math.max(1, box.height);

      let low = minFont;
      let high = maxFont;
      let chosen = minFont;
      let lines = null;

      for (let iteration = 0; iteration < 20; iteration++) {
        const size = (low + high) / 2;
        context.font = `${weight} ${size}px ${family}`;
        const candidate = wrapLines(context, text, width);

        if (candidate.length * size * lineRatio <= height) {
          chosen = size;
          lines = candidate;
          low = size;
        } else {
          high = size;
        }
      }

      if (!lines) {
        context.font = `${weight} ${minFont}px ${family}`;
        lines = wrapLines(context, text, width);
      }

      const lineHeight = chosen * lineRatio;
      let y = box.y + Math.max(0, (height - lines.length * lineHeight) / 2);
      const align = ["left", "center", "right"].includes(options.align)
        ? options.align
        : "left";

      context.save();
      context.beginPath();
      context.rect(box.x, box.y, width, height);
      context.clip();

      if (options.background) {
        context.fillStyle = options.background;
        context.fillRect(box.x, box.y, width, height);
      }

      context.font = `${weight} ${chosen}px ${family}`;
      context.fillStyle = options.color || "#111";
      context.textAlign = align;
      context.textBaseline = "top";

      const textX = align === "right"
        ? box.x + width
        : align === "center"
          ? box.x + width / 2
          : box.x;

      lines.forEach((line) => {
        context.fillText(line, textX, y, width);
        y += lineHeight;
      });

      context.restore();
      return chosen;
    }

    function fitSingleLine(context, text, box, options = {}) {
      if (!text) return;

      const family = options.family || "sans-serif";
      const weight = options.weight || "400";
      const maxFont = Math.max(1, Number(options.maxFont) || 20);
      const minFont = Math.max(
        1,
        Math.min(maxFont, Number(options.minFont) || 1)
      );
      const width = Math.max(1, box.width);
      const height = Math.max(1, box.height);
      const verticalRatio = options.verticalRatio || 1.1;

      let low = minFont;
      let high = maxFont;
      let chosen = minFont;

      for (let iteration = 0; iteration < 20; iteration++) {
        const size = (low + high) / 2;
        context.font = `${weight} ${size}px ${family}`;

        const fits = context.measureText(text).width <= width &&
          size * verticalRatio <= height;

        if (fits) {
          chosen = size;
          low = size;
        } else {
          high = size;
        }
      }

      context.save();
      context.beginPath();
      context.rect(box.x, box.y, width, height);
      context.clip();

      if (options.background) {
        context.fillStyle = options.background;
        context.fillRect(box.x, box.y, width, height);
      }

      context.font = `${weight} ${chosen}px ${family}`;
      context.fillStyle = options.color || "#111";
      context.textAlign = "left";
      context.textBaseline = "middle";
      context.fillText(text, box.x, box.y + height / 2, width);

      context.restore();
    }

    function drawHeader(context, social, headerHeight, eventStyle, spaceStyle, circleStyle) {
      const margin = social ? social.marginX : safeX + 8;
      const x = bleedLeft + margin;
      const width = Math.max(1, trimWidth - margin * 2);
      const eventName = getEl("eventName").value.trim();
      const eventDate = getEl("eventDate").value.trim();
      const eventText = [eventName, eventDate].filter(Boolean).join(" | ");
      const spaceText = getEl("spaceNo").value.trim();
      const circleText = getEl("circleName").value.trim();
      const twoRows = Boolean(PRINT_SPECS[paper]) || orientation === "LANDSCAPE";

      if (twoRows) {
        const compact = paper === "PICSQUARE";
        const topInset = social
          ? (compact ? 4 : Math.max(6, headerHeight * .045))
          : Math.max(safeY, headerHeight * .12);
        const bottomInset = social
          ? (compact ? 4 : Math.max(6, headerHeight * .045))
          : Math.max(safeY, headerHeight * .08);
        const usableHeight = Math.max(2, headerHeight - topInset - bottomInset);
        const rowGap = Math.max(social ? 2 : 4, usableHeight * .08);
        const firstHeight = (usableHeight - rowGap) * .48;
        const secondHeight = usableHeight - rowGap - firstHeight;
        const firstY = bleedTop + topInset;
        const secondY = firstY + firstHeight + rowGap;

        fitSingleLine(
          context,
          eventText,
          { x, y:firstY, width, height:firstHeight },
          {
            maxFont:eventStyle.size,
            minFont:social ? 5 : 8,
            weight:"700",
            family:eventStyle.family,
            color:eventStyle.color,
            background:eventStyle.background
          }
        );

        const columnGap = Math.max(social ? 8 : 14, width * .035);
        const columnWidth = Math.max(1, (width - columnGap) / 2);

        fitSingleLine(
          context,
          spaceText,
          { x, y:secondY, width:columnWidth, height:secondHeight },
          {
            maxFont:spaceStyle.size,
            minFont:social ? 5 : 8,
            weight:"700",
            family:spaceStyle.family,
            color:spaceStyle.color,
            background:spaceStyle.background
          }
        );

        fitSingleLine(
          context,
          circleText,
          {
            x:x + columnWidth + columnGap,
            y:secondY,
            width:columnWidth,
            height:secondHeight
          },
          {
            maxFont:circleStyle.size,
            minFont:social ? 5 : 8,
            weight:"700",
            family:circleStyle.family,
            color:circleStyle.color,
            background:circleStyle.background
          }
        );
        return;
      }

      const top = Math.max(4, headerHeight * .035);
      const available = Math.max(1, headerHeight - top * 2);
      const gap = Math.max(2, available * .025);
      const rowHeight = Math.max(1, (available - gap * 2) / 3);
      let y = bleedTop + top;

      fitText(context, eventText, { x, y, width, height:rowHeight }, {
        maxFont:eventStyle.size,
        minFont:6,
        weight:"700",
        family:eventStyle.family,
        color:eventStyle.color,
        background:eventStyle.background,
        align:"left",
        lineHeight:1
      });

      y += rowHeight + gap;
      fitText(context, spaceText, { x, y, width, height:rowHeight }, {
        maxFont:spaceStyle.size,
        minFont:6,
        weight:"700",
        family:spaceStyle.family,
        color:spaceStyle.color,
        background:spaceStyle.background,
        align:"left",
        lineHeight:1
      });

      y += rowHeight + gap;
      fitText(context, circleText, { x, y, width, height:rowHeight }, {
        maxFont:circleStyle.size,
        minFont:6,
        weight:"700",
        family:circleStyle.family,
        color:circleStyle.color,
        align:"left",
        lineHeight:1
      });
    }

    function roundRect(context, x, y, width, height, radius, fill, stroke, lineWidth = 1) {
      const r = Math.max(0, Math.min(radius, width / 2, height / 2));

      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();

      if (fill) {
        context.fillStyle = fill;
        context.fill();
      }

      if (stroke) {
        context.strokeStyle = stroke;
        context.lineWidth = lineWidth;
        context.stroke();
      }
    }

    function drawCard(context, item, x, y, width, height, config) {
      const padding = config.padding;
      const categoryStyle = getCategoryStyle(item.category);
      const cardFontFamily = getCardFontFamily();

      // カード本体は白。
      roundRect(
        context,
        x,
        y,
        width,
        height,
        config.radius,
        "#FFFFFF",
        "#cbd5e1",
        config.borderWidth
      );

      context.save();
      roundRect(context, x, y, width, height, config.radius, null, null);
      context.clip();

      const heightScale = height / Math.max(1, config.referenceHeight);
      const areaScale = Math.sqrt(
        (width / Math.max(1, config.referenceWidth)) * heightScale
      );
      const textScale = config.textScale * areaScale;

      const categoryHeight = Math.min(
        config.categoryBand * heightScale,
        height * .16,
        Math.max(18, width * .09)
      );
      const ageHeight = Math.min(
        config.ageBand * heightScale,
        height * .11,
        Math.max(15, width * .055)
      );

      // 新刊はパレット内の最暗色。カテゴリ文字色は白。
      context.fillStyle = categoryStyle.background;
      context.fillRect(x, y, width, categoryHeight);

      fitText(
        context,
        item.category,
        {
          x:x + padding,
          y:y + 1,
          width:width - padding * 2,
          height:categoryHeight - 2
        },
        {
          maxFont:Math.min(categoryHeight * .78, width * .2),
          minFont:1,
          weight:"700",
          family:cardFontFamily,
          color:"#FFFFFF",
          align:"left",
          lineHeight:.94
        }
      );

      // 年齢区分帯は2番目に明るい色。
      const ageY = y + categoryHeight;
      const ageBandColor = selectedPalette.ageBandColor;

      context.fillStyle = ageBandColor;
      context.fillRect(x, ageY, width, ageHeight);

      fitText(
        context,
        item.ageRating,
        {
          x:x + padding,
          y:ageY + 1,
          width:width - padding * 2,
          height:ageHeight - 2
        },
        {
          maxFont:Math.min(ageHeight * .75, width * .16),
          minFont:1,
          weight:"700",
          family:cardFontFamily,
          color:getReadableTextColor(ageBandColor),
          align:"left",
          lineHeight:.94
        }
      );

      const contentTop = ageY + ageHeight + padding;
      const contentBottom = y + height - padding;
      const contentHeight = Math.max(1, contentBottom - contentTop);

      let textX = x + padding;
      let textWidth = Math.max(1, width - padding * 2);
      let imageBox = null;

      if (item.image && !item.noImage) {
        const imageWidthRatio = item.category === "新刊" ? .48 : .36;
        const imageScale = Math.min(
          width * imageWidthRatio / Math.max(1, item.imageWidth),
          contentHeight * .96 / Math.max(1, item.imageHeight)
        );
        const imageWidth = item.imageWidth * imageScale;
        const imageHeight = item.imageHeight * imageScale;

        imageBox = {
          x:x + padding,
          y:contentTop + (contentHeight - imageHeight) / 2,
          width:imageWidth,
          height:imageHeight
        };

        textX = imageBox.x + imageWidth + padding;
        textWidth = Math.max(1, x + width - padding - textX);
      }

      const hasTitle = Boolean(item.title);
      const hasPrice =
        !["無料配布","Web展示"].includes(item.category) &&
        Boolean(item.price);
      const hasDescription = Boolean(item.desc);

      const blocks = [];
      if (hasTitle) blocks.push({ type:"title", text:item.title });
      if (hasPrice) blocks.push({ type:"price", text:item.price });
      if (hasDescription) blocks.push({ type:"description", text:item.desc });

      if (blocks.length) {
        // 項目間の余白を小さくし、残りの高さを各欄に配分する。
        const gap = Math.max(0, contentHeight * .012);
        const totalGap = gap * Math.max(0, blocks.length - 1);
        const usableHeight = Math.max(1, contentHeight - totalGap);

        const weights = blocks.map((block) => {
          if (block.type === "title") return .29;
          if (block.type === "price") return .20;
          return .51;
        });
        const weightTotal = weights.reduce((sum, weight) => sum + weight, 0);

        let cursorY = contentTop;

        blocks.forEach((block, index) => {
          const blockHeight = usableHeight * weights[index] / weightTotal;
          let maxFont;
          let color;
          let weight;

          if (block.type === "title") {
            maxFont = Math.min(blockHeight * .82, textWidth * .19) * textScale;
            color = "#0f172a";
            weight = "700";
          } else if (block.type === "price") {
            maxFont = Math.min(blockHeight * .9, textWidth * .22) * textScale;
            color = selectedPalette.mostVivid;
            weight = "700";
          } else {
            // 説明文は入力欄を使わず、カード内の割当領域に合わせて自動縮小。
            maxFont = Math.min(blockHeight * .78, textWidth * .16) * textScale;
            color = "#475569";
            weight = "400";
          }

          fitText(
            context,
            block.text,
            {
              x:textX,
              y:cursorY,
              width:textWidth,
              height:blockHeight
            },
            {
              maxFont:Math.max(4, maxFont),
              minFont:Math.max(4, 7 * textScale),
              family:cardFontFamily,
              color,
              weight,
              align:"left",
              lineHeight:.94
            }
          );

          cursorY += blockHeight + gap;
        });
      }

      if (imageBox && item.image) {
        context.drawImage(
          item.image,
          imageBox.x,
          imageBox.y,
          imageBox.width,
          imageBox.height
        );
      }

      context.restore();

      roundRect(
        context,
        x,
        y,
        width,
        height,
        config.radius,
        null,
        "#cbd5e1",
        config.borderWidth
      );
    }

    function renderCanvas() {
      try {
        if (!outputWidth || !outputHeight) return;

        const token = ++renderToken;
        const context = canvas.getContext("2d", { alpha:false });
        if (!context) throw new Error("Canvas 2D contextを取得できません。");

        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, outputWidth, outputHeight);
        drawBackground(context);

        const social = SOCIAL_LAYOUTS[paper] || null;
        const headerHeight = social
          ? social.header
          : Math.round(trimHeight * (orientation === "LANDSCAPE" ? .17 : .15));

        context.fillStyle = selectedPalette.header;
        context.fillRect(
          0,
          0,
          outputWidth,
          Math.min(outputHeight, bleedTop + headerHeight)
        );

        const accentHeight = social
          ? Math.max(3, headerHeight * .025)
          : Math.max(8, 12 * trimWidth / 3307);

        context.fillStyle = selectedPalette.categoryColors[1];
        context.fillRect(
          bleedLeft,
          bleedTop + headerHeight - accentHeight,
          trimWidth,
          accentHeight
        );

        const sizes = HEADER_FONT_SIZES[paper];
        const defaultHeaderText = getReadableTextColor(selectedPalette.header);

        drawHeader(
          context,
          social,
          headerHeight,
          getHeaderStyle("eventInfo", sizes.event, defaultHeaderText),
          getHeaderStyle("spaceInfo", sizes.space, defaultHeaderText),
          getHeaderStyle("circleInfo", sizes.circle, defaultHeaderText)
        );

        const columns = 2;
        const printScale = trimWidth / 3307;
        const marginX = social ? social.marginX : safeX;
        const marginY = social ? social.marginY : safeY;
        const gapX = social ? social.gapX : Math.round(40 * printScale);
        const gapY = social ? social.gapY : Math.round(40 * printScale);
        const padding = social ? social.padding : Math.round(25 * printScale);
        const startY = headerHeight +
          (social ? 10 : Math.max(24 * printScale, safeY));

        const rows = [];

        items.forEach((item) => {
          const isNewRelease = item.category === "新刊";
          let row = rows[rows.length - 1];

          if (
            !row ||
            row.isNewRelease !== isNewRelease ||
            row.items.length >= columns
          ) {
            row = {
              items:[],
              units:isNewRelease ? 1.5 : 1,
              isNewRelease
            };
            rows.push(row);
          }

          row.items.push(item);
        });

        if (!rows.length) return;

        const totalUnits = rows.reduce((sum, row) => sum + row.units, 0);
        const unitHeight = Math.max(
          1,
          (trimHeight - startY - marginY - gapY * (rows.length - 1)) /
            totalUnits
        );

        const cardWidth = Math.max(
          1,
          (trimWidth - marginX * 2 - gapX) / columns
        );

        const config = {
          padding,
          radius:social ? 12 : Math.max(12, 24 * printScale),
          categoryBand:social
            ? social.categoryBand
            : unitHeight * .14,
          ageBand:social
            ? social.ageBand
            : unitHeight * .09,
          borderWidth:social ? 2 : Math.max(2, 4 * printScale),
          textScale:social ? social.cardScale : printScale,
          referenceWidth:cardWidth,
          referenceHeight:unitHeight
        };

        let y = bleedTop + startY;

        rows.forEach((row) => {
          if (token !== renderToken) return;

          const cardHeight = unitHeight * row.units;

          row.items.forEach((item, columnIndex) => {
            const x = bleedLeft + marginX +
              columnIndex * (cardWidth + gapX);
            drawCard(context, item, x, y, cardWidth, cardHeight, config);
          });

          y += cardHeight + gapY;
        });
      } catch (error) {
        console.error("プレビュー描画エラー:", error);
      }
    }

    function applyScale(scale) {
      const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const stage = getEl("canvasStage");
      const container = getEl("canvasContainer");

      stage.style.width = `${outputWidth}px`;
      stage.style.height = `${outputHeight}px`;
      stage.style.transform = `scale(${safeScale})`;
      container.style.width = `${outputWidth * safeScale}px`;
      container.style.height = `${outputHeight * safeScale}px`;

      getEl("zoomDisplay").textContent =
        `表示 ${Math.round(safeScale * 100)}%`;
      getEl("zoomSlider").value = String(
        Math.max(1, Math.min(200, Math.round(safeScale * 100)))
      );
    }

    function fitPreview() {
      const workspace = getEl("workspace");
      const availableWidth = Math.max(1, workspace.clientWidth - 50);
      const availableHeight = Math.max(1, workspace.clientHeight - 75);

      applyScale(Math.min(
        availableWidth / outputWidth,
        availableHeight / outputHeight
      ));
    }

    function setupResize() {
      const workspace = getEl("workspace");

      if ("ResizeObserver" in window) {
        new ResizeObserver(() => {
          if (previewMode === "fit") fitPreview();
        }).observe(workspace);
      }

      window.addEventListener("resize", () => {
        if (previewMode === "fit") fitPreview();
      });
    }

    function setupToolbarDrag() {
      const toolbar = getEl("previewToolbar");
      const handle = getEl("previewToolbarDrag");
      const workspace = getEl("workspace");
      let drag = null;

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        const toolbarRect = toolbar.getBoundingClientRect();
        const workspaceRect = workspace.getBoundingClientRect();

        toolbar.style.left = `${toolbarRect.left - workspaceRect.left}px`;
        toolbar.style.top = `${toolbarRect.top - workspaceRect.top}px`;
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";

        drag = {
          id:event.pointerId,
          x:event.clientX,
          y:event.clientY,
          left:toolbarRect.left - workspaceRect.left,
          top:toolbarRect.top - workspaceRect.top
        };

        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;

        const rect = workspace.getBoundingClientRect();

        toolbar.style.left = `${Math.max(
          0,
          Math.min(
            rect.width - toolbar.offsetWidth,
            drag.left + event.clientX - drag.x
          )
        )}px`;

        toolbar.style.top = `${Math.max(
          0,
          Math.min(
            rect.height - toolbar.offsetHeight,
            drag.top + event.clientY - drag.y
          )
        )}px`;
      });

      const finish = (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
      };

      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    }

    function openPrintPreview() {
      const isSocial = Boolean(SOCIAL_PRESETS[paper]);
      const spec = PRINT_SPECS[paper];

      const widthMm = isSocial
        ? outputWidth * 25.4 / 200
        : orientation === "LANDSCAPE"
          ? spec.heightMm
          : spec.widthMm;

      const heightMm = isSocial
        ? outputHeight * 25.4 / 200
        : orientation === "LANDSCAPE"
          ? spec.widthMm
          : spec.heightMm;

      const popup = window.open("", "_blank");
      if (!popup) {
        alert("ポップアップを許可してください。");
        return;
      }

      const doc = popup.document;
      doc.title = "印刷プレビュー";

      const meta = doc.createElement("meta");
      meta.setAttribute("charset", "UTF-8");
      doc.head.appendChild(meta);

      const style = doc.createElement("style");
      style.textContent = `
        @page { size:${widthMm}mm ${heightMm}mm; margin:0; }
        html,body { margin:0; padding:0; }
        img { display:block; width:${widthMm}mm; height:${heightMm}mm; }
        @media screen {
          body {
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:24px;
            background:#1e293b;
          }
          img { width:min(90vw,${widthMm}mm); height:auto; }
        }
      `;
      doc.head.appendChild(style);

      const image = doc.createElement("img");
      image.alt = "印刷用プレビュー";
      image.src = canvas.toDataURL("image/png");
      doc.body.appendChild(image);

      image.addEventListener("load", () => {
        popup.focus();
        popup.print();
      }, { once:true });
    }

    function bindEvents() {
      getEl("paperSizeSelect").addEventListener("change", updateLayout);
      getEl("orientationSelect").addEventListener("change", updateLayout);

      ["eventDate", "eventName", "circleName", "spaceNo"].forEach((id) => {
        getEl(id).addEventListener("input", renderCanvas);
      });

      // フォント選択箇所はヘッダーとカード全体の2か所のみ。
      ["headerFontFamily", "cardFontFamily"].forEach((id) => {
        getEl(id).addEventListener("change", async (event) => {
          const family = event.target.value;

          if (document.fonts && family) {
            try {
              await document.fonts.load(`16px ${family}`);
            } catch (error) {
              console.warn("フォント読み込みに失敗しました:", error);
            }
          }

          renderCanvas();
        });
      });

      [
        "headerBgColor",
        "headerAccentColor",
        "eventInfoFontSize",
        "eventInfoTextColor",
        "eventInfoBgEnabled",
        "eventInfoBgColor",
        "spaceInfoFontSize",
        "spaceInfoTextColor",
        "spaceInfoBgEnabled",
        "spaceInfoBgColor",
        "circleInfoFontSize",
        "circleInfoTextColor",
        "circleInfoBgEnabled",
        "circleInfoBgColor"
      ].forEach((id) => {
        const element = document.getElementById(id);
        if (!element) return;

        element.addEventListener("input", renderCanvas);
        element.addEventListener("change", renderCanvas);
      });

      getEl("bgTypeSelect").addEventListener("change", (event) => {
        const type = event.target.value;
        getEl("customBgControls").classList.toggle("hidden", type !== "custom");
        getEl("singleColorControls").classList.toggle("hidden", type !== "color");
        renderCanvas();
      });

      getEl("bgColorPicker").addEventListener("input", renderCanvas);

      getEl("customBgInput").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        try {
          const loaded = await readImageFile(file);
          customBackground = loaded.image;
          renderCanvas();
        } catch (error) {
          alert(error.message);
        }
      });

      getEl("batchImageInput").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        if (files.length) await uploadBatch(files);
      });

      getEl("addItemBtn").addEventListener("click", addItem);

      getEl("fitCanvasBtn").addEventListener("click", () => {
        previewMode = "fit";
        fitPreview();
      });

      getEl("zoomSlider").addEventListener("input", (event) => {
        previewMode = "manual";
        applyScale(Number(event.target.value) / 100);
      });

      getEl("printPreviewBtn").addEventListener("click", openPrintPreview);

      getEl("exportPng").addEventListener("click", () => {
        renderCanvas();
        const link = document.createElement("a");
        link.download = `oshinagaki_${paper}_${orientation}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });

      setupResize();
      setupToolbarDrag();
    }

    initialize();
  </script>
</body>
</html>
